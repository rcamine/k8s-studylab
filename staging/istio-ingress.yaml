# Routing only: staging.rcamine.com -> the web service in staging.
#
# The Gateway (TLS termination, the :443 and :80 listeners) is shared and
# lives in infra/gateway.yaml. Binding by `<namespace>/<name>` is what lets
# a VirtualService here attach to a Gateway in istio-system.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: web
  namespace: staging
spec:
  hosts:
    - "staging.rcamine.com"
  gateways:
    - istio-system/rcamine-gateway
  http:
    - route:
        - destination:
            host: web.staging.svc.cluster.local
            port:
              number: 80
