apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: prod
spec:
  podSelector: {} # ← selects EVERY pod in prod
  policyTypes:
    - Ingress # ← we're governing INCOMING traffic
  # note: there is NO "ingress:" section below.
  # A selected pod + zero allow-rules = deny all incoming.
