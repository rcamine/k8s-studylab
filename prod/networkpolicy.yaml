# 1. default-deny all inbound to prod
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: prod
spec:
  podSelector: {} # ← selects EVERY pod in prod
  policyTypes:
    - Ingress # ← we're governing INCOMING traffic
  # note: there is NO "ingress:" section below.
  # A selected pod + zero allow-rules = deny all incoming.
---
# 2. allow the known-good sources back in
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-known-sources
  namespace: prod
spec:
  podSelector: {} # applies to all prod pods
  policyTypes:
    - Ingress
  ingress:
    - from:
        # hole 1: same namespace (prod → prod)
        - podSelector: {}
        # hole 2: the monitoring namespace (Prometheus later)
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        # hole 3: Istio ingress gateway (external traffic in, Phase 2)
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
