# Routing only: argocd.rcamine.com -> the Argo CD UI/API.
# TLS terminates at the shared Gateway in infra/gateway.yaml.
#
# Depends on argocd-server running with --insecure (server.insecure in the
# argocd-cmd-params-cm ConfigMap). Otherwise Argo serves its own self-signed
# cert and the gateway would have to re-encrypt to something it can't trust.
# That setting lives outside git — see BOOTSTRAP step 7.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: argocd
  namespace: argocd
spec:
  hosts:
    - "argocd.rcamine.com"
  gateways:
    - istio-system/rcamine-gateway
  http:
    - route:
        - destination:
            # port 80 on the Service -> containerPort 8080, where
            # argocd-server multiplexes the HTTP UI and the gRPC API.
            host: argocd-server.argocd.svc.cluster.local
            port:
              number: 80
