# The staging environment: web + client + policies + external ingress.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rcamine/k8s-studylab.git
    targetRevision: main
    path: staging
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  # The Rollouts controller owns these fields at runtime; git only holds
  # their at-rest values. Without this, selfHeal reverts the canary weight
  # to 0 seconds after the controller sets it, and the two controllers
  # fight for the whole rollout.
  ignoreDifferences:
    - group: networking.istio.io
      kind: VirtualService
      jqPathExpressions:
        - .spec.http[].route[].weight
    - group: networking.istio.io
      kind: DestinationRule
      jqPathExpressions:
        - .spec.subsets[].labels."rollouts-pod-template-hash"
  # Staging is fully automated: a push to main deploys, drift is reverted.
  syncPolicy:
    automated:
      # a resource removed from staging/ gets deleted from the cluster.
      # Safe here: no Namespaces live in this path, only workloads.
      prune: true
      # revert ANY live change that contradicts git, within seconds.
      # Right for staging (git is the only way in); deliberately NOT set
      # on prod, where it would fight an on-call doing emergency surgery.
      selfHeal: true
    syncOptions:
      # ignoreDifferences alone only affects the *diff*. This is what makes
      # a sync actually leave those fields alone. Mandatory with selfHeal.
      - RespectIgnoreDifferences=true
      # Don't re-apply resources already Synced. Narrows the window where
      # an unrelated sync could stomp an in-flight canary.
      - ApplyOutOfSyncOnly=true
