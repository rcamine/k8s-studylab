# The staging environment: web + client + policies + external ingress.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rcamine/k8s-studylab.git
    targetRevision: main
    path: staging
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  # Staging is fully automated: a push to main deploys, drift is reverted.
  syncPolicy:
    automated:
      # a resource removed from staging/ gets deleted from the cluster.
      # Safe here: no Namespaces live in this path, only workloads.
      prune: true
      # revert ANY live change that contradicts git, within seconds.
      # Right for staging (git is the only way in); deliberately NOT set
      # on prod, where it would fight an on-call doing emergency surgery.
      selfHeal: true
